<style>

  .c3 .ic{font-size:40px} .c3 .t{font-size:21px;font-weight:900;margin:0} .c3 .was{font-size:15px} .c3 .big{font-size:40px} .c3 .pl{font-size:15px;margin-top:4px} .c3 .hp{font-size:13px;margin-top:4px}
  .pm{display:flex;align-items:center;gap:12px;margin-top:22px} .pm div{flex:1;background:var(--bg);border-radius:16px;padding:14px 18px} .pm .ar{flex:0;background:none;padding:0;font-size:26px;color:var(--red);font-weight:900}
  .pm span{display:block;font-size:13px;color:var(--sub);font-weight:600} .pm b{font-size:24px;font-weight:900} .pm .hi{background:var(--red);color:#fff} .pm .hi span{color:#FFD5DB}
  .w2{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0 4px} .w2 div{background:var(--bg);border-radius:16px;padding:14px 16px}
  .w2 span{display:block;font-size:13px;color:var(--sub);font-weight:700} .w2 b{display:block;font-size:30px;font-weight:900;color:var(--red);margin:6px 0 2px} .w2 small{font-size:12px;color:var(--sub)}

  .rg3{display:grid;grid-template-columns:1fr 1fr;gap:16px} .rgt{font-size:20px;font-weight:900;margin-bottom:6px}
  .rg3 .ring{border-radius:16px;padding:10px 12px;border:3px solid} .rg3 .ring .ring{margin-top:8px}
  .rg3 .new{border-color:var(--red);background:#FFF5F6} .rg3 .cur{border-color:var(--gray);background:#F3F4F6} .rg3 .lv0.new{border-color:var(--pur);background:var(--purbg)}
  .rg3 .rh{font-size:15px} .rg3 .rh span{display:block;font-size:12px;color:var(--sub);font-weight:700} .rg3 .rx{font-size:12.5px;color:#374151;margin-top:3px}

  .jbt{font-size:22px;font-weight:900;margin-top:6px;letter-spacing:-.5px}
  .jbn{text-align:right} .jbn span{display:block;font-size:14px;color:var(--sub)} .jbn b{font-size:36px;font-weight:900;color:var(--red);letter-spacing:-1px} .jbn i{font-style:normal;display:inline-block;margin-left:8px;font-size:14px;font-weight:800;color:#fff;background:var(--red);padding:4px 10px;border-radius:999px;vertical-align:8px}
  .jhp3{font-size:14px;color:#4C1D95;background:var(--purbg);border:1px solid #DDD6FE;border-radius:10px;padding:7px 12px;margin:10px 0}

function amtMan(s){ // "1억8,200만원"·"4천만원"·"1백만원" → 만원
  var m = String(s).replace(/[\s,원]/g, "").match(/^(?:(\d+)억)?(?:(\d+)천)?(?:(\d+)백)?(\d+)?(만)?$/);

  var v = (+m[1] || 0) * 10000 + (+m[2] || 0) * 1000 + (+m[3] || 0) * 100 + (+m[4] || 0);
  return m[5] || m[1] ? v : v / 10000; // "5천원"처럼 만 단위가 없으면 원 → 만원
}
function pdfLines(items){
  var rows = [];
  items.forEach(function(it){
    var r = null;
    for (var i = 0; i < rows.length; i++) if (Math.abs(rows[i].y - it.y) <= 3) { r = rows[i]; break; }
    if (!r) { r = { y: it.y, items: [] }; rows.push(r); }
    r.items.push(it);
  });
  rows.sort(function(a, b){ return b.y - a.y; });
  return rows.map(function(r){
    r.items.sort(function(a, b){ return a.x - b.x; });
    var out = "", end = null;
    r.items.forEach(function(it){ if (end !== null) out += (it.x - end > 12) ? " | " : (it.x - end > 1.5 ? " " : ""); out += it.s; end = it.x + it.w; });
    return { y: r.y, x: r.items[0].x, t: out };
  });
}

}

    var inTable = false;

      if (!r.agent && (m = t.match(/^컨설턴트([가-힣]{2,5})(\(|$)/))) r.agent = m[1];
      if (!r.branch && (m = t.match(/^소속([가-힣]+)$/))) r.branch = m[1];
      if (!r.total && (m = t.match(/보장보험료합계([\d,]+)원/))) r.total = +m[1].replace(/,/g, "");

      if (ai < 0 && cells.length === 2 && /^(?:[가-힣\/\s]*\s)?\d{1,4}$/.test(cells[0]) && /^[\d,]+$/.test(cells[1])) { // 간병인지원형: 번호 | 보험료, 가입금액은 위·아래 줄에 "간병인지원 / 또는 5천원"

    });

}

  if (!a || !a.list || !a.list.length) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="pcon"><b>현재 가입 상품 ' + a.list.length + '건</b><small>해지할 상품은 체크를 풀어 주세요. 체크한 상품만 현재 보장에 넣어요.</small>'
    + a.list.map(function(x, i){ return '<label><input type="checkbox" data-ci="' + i + '"' + (a.skip[i] ? '' : ' checked') + '><span>' + esc(x.co) + ' · ' + esc(x.prod) + '</span><em>월 ' + wonFull(x.prem) + '</em></label>'; }).join('') + '</div>';
  [].forEach.call(box.querySelectorAll('input'), function(cb){ cb.onchange = function(){ if (cb.checked) delete a.skip[cb.dataset.ci]; else a.skip[cb.dataset.ci] = 1; document.getElementById("pResult").innerHTML = ""; }; });
}
function pdfStatus(){
  var a = PDF_IN.ana, p = PDF_IN.prop, nm = document.getElementById("pName").value.trim(), ag = document.getElementById("pAge").value;
  document.getElementById("pGo").disabled = !((a || p) && nm && +ag > 0);
  conList();
  document.getElementById("pAnaS").innerHTML = a ? '✅ 담보 ' + a.order.length + '가지 · 계약 ' + a.contracts + '건 읽음' : '';
  document.getElementById("pPropS").innerHTML = p ? '✅ 담보 ' + p.riders.length + '가지 읽음' : '';
}
async function pdfTake(kind, file){
  var el = document.getElementById(kind === "ana" ? "pAnaS" : "pPropS"); el.innerHTML = "읽는 중…"; PDF_IN[kind] = null; document.getElementById("pResult").innerHTML = "";
  try {
    var pages = await readPdfPages(await file.arrayBuffer());
    if (pages.every(function(p){ return !p.length; })) throw new Error("글자가 없는 PDF(사진으로 된 PDF)예요. 회사 시스템에서 PDF로 다시 내려받아 주세요.");
    var r = kind === "ana" ? parseAnalysis(pages) : parseProposal(pages);
    if (kind === "ana" && !r.order.length) throw new Error("보장분석표를 찾지 못했어요. 보장분석 PDF가 맞는지 확인해 주세요.");
    if (kind === "prop" && !r.riders.length) throw new Error("담보 표를 찾지 못했어요. 가입제안서 PDF가 맞는지 확인해 주세요.");
    PDF_IN[kind] = r; pdfStatus();
  } catch (e) { pdfStatus(); el.innerHTML = '<span style="color:var(--red)">❌ ' + esc(e.message || e) + '</span>'; }
}
function pdfBuild(){
  var today = new Date(), z = function(n){ return (n < 10 ? "0" : "") + n; };
  var out = buildFromPdf(PDF_IN.ana || { cov: {}, order: [], extra: [], premium: 0, contracts: 0, odd: 0 }, PDF_IN.prop || { riders: [], total: 0, agent: "", branch: "" }, { name: document.getElementById("pName").value.trim(), age: +document.getElementById("pAge").value, sex: document.getElementById("pSex").value, date: today.getFullYear() + "." + z(today.getMonth() + 1) + "." + z(today.getDate()) });
  out.data.noAna = !PDF_IN.ana; out.data.noProp = !PDF_IN.prop;
  DATA = out.data; renderAll(); buildForm();
  var c = out.check, sumOk = c.total && c.sum === c.total, h = !PDF_IN.prop ? '<div class="prc ok">보장분석 PDF로 현재 보장만 만들었어요. 제안 담보는 없어요.</div>' : '<div class="prc ' + (sumOk ? 'ok' : 'bad') + '">' + (sumOk ? '✅ 읽은 담보 ' + c.riders + '가지의 보험료 합이 설계서 합계(' + wonFull(c.total) + ')와 같아요.' : '⚠️ 읽은 담보 보험료 합 ' + wonFull(c.sum) + ' ≠ 설계서 합계 ' + wonFull(c.total) + ' — 빠진 담보가 있을 수 있어요. [숫자 고치기]로 꼭 확인해 주세요.') + '</div>';
  var unv = M.grown.filter(function(it){ return it.unv; });
  if (unv.length) h += '<div class="prc bad">⚠️ 약관을 아직 확인하지 않은 담보 ' + unv.length + '가지는 "지급 조건 확인 중"으로 나오고 치료 예시 합계에서 빠져요: ' + unv.map(function(it){ return esc(it.n); }).join(", ") + '</div>';
  if (c.covLost.length) h += '<div class="prc bad">⚠️ 연결하지 못한 보장분석 항목: ' + c.covLost.map(esc).join(", ") + '</div>';
  if (c.odd) h += '<div class="prc bad">⚠️ 계약표에서 읽지 못한 줄 ' + c.odd + '개 — 그 밖의 현재 보장에 빠졌을 수 있어요.</div>';
  var chk = M.js.filter(function(x){ return x.steps.some(function(s){ return s.rows.some(function(r){ return !r.ok; }); }); }).length;
  if (chk) h += '<div class="prc bad">⚠️ 치료 예시 ' + chk + '가지에 "확인" 표시가 있어요. 통합치료비 가입금액이 약관 지급표(기본형 4천만·8천만·1억 / Ⅱ 4천만·7천만·1억 / 순환계 2천만·3천만·5천만·8천만·1억)에 없는 금액이라 그 금액은 합계에서 빠졌어요.</div>';
  h += '<div class="prc">금액은 PDF에서 자동으로 읽은 값이에요. 고객에게 보여 주기 전에 설계서와 한 번 더 맞춰 보세요.</div><button class="pgo" onclick="pdfBox(false);setView(\'sum\');window.scrollTo(0,0)">제안서 보기</button>';
  document.getElementById("pResult").innerHTML = h;
}
["ana", "prop"].forEach(function(k){
  var dz = document.getElementById(k === "ana" ? "pAna" : "pProp"), inp = dz.querySelector("input");
  dz.onclick = function(e){ if (e.target !== inp) inp.click(); };
  inp.onchange = function(){ if (inp.files[0]) pdfTake(k, inp.files[0]); inp.value = ""; };
  dz.ondragover = function(e){ e.preventDefault(); dz.classList.add("on"); };
  dz.ondragleave = function(){ dz.classList.remove("on"); };
  dz.ondrop = function(e){ e.preventDefault(); dz.classList.remove("on"); if (e.dataTransfer.files[0]) pdfTake(k, e.dataTransfer.files[0]); };
});
document.getElementById("pName").oninput = document.getElementById("pAge").oninput = pdfStatus;
document.getElementById("pGo").onclick = pdfBuild;
document.getElementById("bPdf").onclick = function(){ pdfBox(true); };
document.getElementById("bSum").onclick = function(){ setView("sum"); };
document.getElementById("bPt").onclick = function(){ setView("pt"); };
document.getElementById("bEdit").onclick = function(){ panel(!document.getElementById("panel").classList.contains("open")); };
document.getElementById("bPrint").onclick = function(){ window.print(); };
document.getElementById("prev").onclick = function(){ showSlide(cur - 1); };
document.getElementById("next").onclick = function(){ showSlide(cur + 1); };
document.getElementById("full").onclick = function(){ var el = document.getElementById("vPt"); if (el.requestFullscreen) el.requestFullscreen(); };
document.getElementById("stage").onclick = function(e){ if (VIEW === "pt") showSlide(e.clientX > window.innerWidth / 2 ? cur + 1 : cur - 1); };
document.addEventListener("keydown", function(e){ if (VIEW !== "pt" || document.getElementById("panel").classList.contains("open")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { showSlide(cur + 1); e.preventDefault(); }
  if (e.key === "ArrowLeft" || e.key === "PageUp") { showSlide(cur - 1); e.preventDefault(); } });
window.addEventListener("resize", fit);
window.addEventListener("beforeprint", function(){ [].forEach.call(document.querySelectorAll('#stage .slide'), function(el){ el.style.display = ''; }); });
window.addEventListener("afterprint", function(){ showSlide(cur); });
renderAll(); buildForm(); pdfBox(true);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ renderAll(); }); // 글꼴을 다 불러온 뒤 높이를 다시 재서 빈 곳 채우기
</script>
</body>
</html>
