  return { when: "因治疗特定循环系统疾病接受的主要治疗Ⅱ（溶栓·综合医院重症监护室4天以上·手术·CRRT·呼吸机·低温治疗·部分体外循环）次数一年内达" + m[1] + "次以上时，每年给付1次保额", note: "手术每次算1次 · 同日手术算1次 · 投保1年内为50%" };
}

function buildFromPdf(ana, prop, who){
  var D = JSON.parse(TEMPLATE), byN = {};

  // 해지 예정으로 체크를 푼 계약은 현황표 금액에서 그 계약 담보만큼 빼고, 그 밖의 현재 보장에서도 뺀다

  prop.riders.forEach(function(x){

    if (cycTerm(nm)) { extraNew.push({ n: nm, now: 0, rec: 0, add: x.amt, rider: nm, renew: renew, unv: false }); matched++; return; }
    // 간병인·간호간병 일당은 병실 입원일당(1인실·2-3인실)과 다른 담보라 따로 둔다 → 간병인 보장 표
    if (careParse(nm)) { careNew.push({ n: nm, now: 0, rec: 0, add: x.amt, rider: nm, svc: x.sup || undefined, unv: !TERMS[nm] && !careTerm(nm) }); return; }
    if ((m = nm.match(/^수술비Ⅱ\(1-5종\)\[(상해|질병)(\d)종\]/))) { var it5 = byN[m[1] + " " + m[2] + "종 수술비"]; it5.add = (+it5.add || 0) + x.amt; matched++; return; }
    if ((m = nm.match(/^(상해|질병)1-5종수술비\(plus\).*\((\d)종/))) { plus[m[1]][m[2]] = (plus[m[1]][m[2]] || 0) + x.amt; matched++; return; }
    if ((m = nm.match(/^130대질병수술비\[(.+?)\]/)) && C130_KEY[m[1]]) { s130[C130_KEY[m[1]]] = (s130[C130_KEY[m[1]]] || 0) + x.amt; matched++; return; }

    if (!byN[nm]) { byN[nm] = { n: nm, now: 0, rec: 0, add: 0 }; D.groups[4].items.push(byN[nm]); }
    byN[nm].add = Math.max.apply(null, ks.map(function(j){ return p[j]; }));
    byN[nm].rider = k + " 1-5종 수술비(plus)(연간 2회 이상) " + ks.map(function(j){ return j + "종 " + won(p[j]); }).join("·");
  });
  if (careNew.length) D.groups.push({ icon: "🧑‍⚕️", name: "간병인 보장", items: careNew });
  if (extraNew.length) D.groups.push({ icon: "➕", name: "그 밖의 제안 담보", items: extraNew });
  if (oi.length) D.groups.push({ icon: "📁", name: "그 밖의 현재 보장", items: oi });

  // 2023년 이전에 가입한 변호사 선임비용: 대부분 구속·기소된 경우만 보장(경찰 조사 단계는 2022년 말~2023년 상품부터)

  D.contracts = ana.contracts - gone.length; D.premiumAdd = prop.total;
  // 보험료 전후 비교용 줄(해지·담보 삭제)은 제안서를 만든 뒤 '정리하는 보험' 단계에서 설계사가 직접 적은 금액으로만 채운다(cutApply)
  D.cutList = []; D.cutMan = []; D.cutN = gone.length;
  // 현재 월 보험료: 계약마다 보험료를 다 읽었으면 '납입 중이고 체크한 계약'만 더한다. 못 읽은 계약이 있으면 첫 장 합계에서 뺀다.
  var lst = ana.list || [], live = lst.filter(function(x, i){ return !skip[i] && !x.paid; });
  D.paidList = lst.filter(function(x, i){ return !skip[i] && x.paid; }).map(function(x){ return { co: x.co, prod: x.prod, prem: x.prem, pay: x.pay || "" }; });
  D.premiumNow = lst.length && lst.every(function(x){ return x.prem > 0; })
    ? live.reduce(function(s, x){ return s + x.prem; }, 0)
    : Math.max(0, ana.premium - gone.filter(function(x){ return !x.paid; }).reduce(function(s, x){ return s + x.prem; }, 0));
  var sum = prop.riders.reduce(function(s, x){ return s + x.prem; }, 0);
  return { data: D, check: { riders: prop.riders.length, matched: matched, unknown: extraNew.map(function(x){ return x.n; }), sum: sum, total: prop.total, cov: ana.order.length, covLost: ana.order.filter(function(k){ return !ANA_MAP[k] && !ANA_NEW[k]; }), others: oi.length, odd: ana.odd } };
}

async function pdfTake(kind, file){
  var el = document.getElementById(kind === "ana" ? "pAnaS" : "pPropS"); document.getElementById("pResult").innerHTML = "";
  if (kind === "ana") { el.innerHTML = "读取中…"; PDF_IN.ana = null; } else el.insertAdjacentHTML("beforeend", '<div class="ppf">' + esc(file.name) + ' 读取中…</div>');
  try {
    var pages = await readPdfPages(await file.arrayBuffer());
    if (pages.every(function(p){ return !p.length; })) throw new Error("这是没有文字的PDF（图片PDF）。请从公司系统重新下载PDF。");
    var r = kind === "ana" ? parseAnalysis(pages) : parseProposal(pages);
    if (kind === "ana" && !r.order.length) throw new Error("未找到保障分析表。请确认是否为保障分析（보장분석）PDF。");
    if (kind === "prop" && !r.riders.length) throw new Error("未找到保障表。请确认是否为投保设计书（가입제안서）PDF。");
    if (kind === "ana") PDF_IN.ana = r; else { PDF_IN.props.push({ name: file.name, r: r }); PDF_IN.prop = mergeProps(); }
    pdfStatus();
  } catch (e) { pdfStatus(); el.insertAdjacentHTML("beforeend", '<div class="ppf" style="color:var(--red)">❌ ' + (kind === "prop" ? esc(file.name) + ': ' : '') + esc(e.message || e) + '</div>'); }
}

function linkBox(open){
  var b = document.getElementById("linkBox"); b.classList.toggle("open", open); if (!open) return;
  document.getElementById("lAgent").value = DATA.agent || "";
  try { document.getElementById("lPhone").value = localStorage.getItem("planAgentPhone") || ""; } catch (e) {}
  try { document.getElementById("lKakao").value = localStorage.getItem("planAgentKakao") || ""; } catch (e) {}
  document.getElementById("lOut").hidden = true; document.getElementById("lMsgOk").textContent = "";
  var sb = document.getElementById("lShare"); sb.hidden = false; sb.disabled = !navigator.share; sb.title = navigator.share ? "" : "在手机上打开后可以按"; if (!navigator.share) sb.textContent = "📤 分享（在手机上打开后可以按）";
}
function lSay(t, bad){ var o = document.getElementById("lMsgOk"); o.style.color = bad ? "var(--red)" : "#14532D"; o.textContent = t; }
async function copyText(t){
  try { await navigator.clipboard.writeText(t); return true; } catch (e) {
    var ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); var ok = false; try { ok = document.execCommand("copy"); } catch (e2) {} ta.remove(); return ok; }
}
function lFull(){ return document.getElementById("lMsg").value.trim() + "\n" + LINK; }
document.getElementById("bLink").onclick = function(){ if (cutBlocked()) return; linkBox(true); };
document.getElementById("lMake").onclick = async function(){
  var ph = document.getElementById("lPhone").value.trim(), ag = document.getElementById("lAgent").value.trim();
  if (M.all.every(function(it){ return !(+it.now) && !(+it.add); })) return lSay("请先用［📄 用PDF生成］生成建议书。", true);
  if (cutNeed()) return lSay("请先在［📄 用PDF生成］中确认“有要整理的保险吗？”。", true);
  if (telNum(ph).length < 9) return lSay("请填写客户拨打的号码。", true);
  var kk = document.getElementById("lKakao").value.trim();
  if (kk && !kakaoOk(kk)) return lSay("KakaoTalk地址只能填写以 https://open.kakao.com/ 或 https://pf.kakao.com/ 开头的地址。", true);
  try { localStorage.setItem("planAgentPhone", ph); localStorage.setItem("planAgentKakao", kk); } catch (e) {}
  var d = slimData(document.getElementById("lName").checked); d.phone = ph; d.agent = ag; if (kk) d.kakao = kk;
  var packed = await packData(d), shortOk = false;
  if (SHORT_BASE) { lSay("正在生成短链接…"); try { LINK = await shortLink(packed, ag); shortOk = true; } catch (e) { lSay("未能连接短链接服务器，已生成长链接。", true); } }
  if (!shortOk) LINK = location.href.split(/[?#]/)[0] + "#c=" + packed;
  var who = d.customer ? d.customer : "尊敬的客户";
  document.getElementById("lMsg").value = who + "，您好。" + (ag ? "我是" + ag + "顾问。" : "") + "已把之前说明的保障建议整理成方便在手机上查看的样子。请点击下方链接查看，有疑问请随时给我打电话。";
  document.getElementById("lLen").textContent = "链接长度 " + LINK.length.toLocaleString("ko-KR") + "字" + (LINK.length > 8000 ? " · 太长，用短信（SMS）发送可能会被截断。请用KakaoTalk发送。" : "");
  document.getElementById("lOut").hidden = false; if (shortOk || !SHORT_BASE) lSay("✅ 链接已生成。请先预览确认后再发送。" + (shortOk ? "（90天后自动失效）" : ""));
};
// 짧은 링크: 휴대폰 안에서 암호(AES-GCM)로 잠가 서버에 올리고, 열쇠는 링크 # 뒤에만 둔다. 서버는 내용을 볼 수 없다.
async function shortLink(packed, agent){
  var key = crypto.getRandomValues(new Uint8Array(16)), iv = crypto.getRandomValues(new Uint8Array(12));
  var k = await crypto.subtle.importKey("raw", key, "AES-GCM", false, ["encrypt"]);
  var ct = new Uint8Array(await crypto.subtle.encrypt({ name: "AES-GCM", iv: iv }, k, new TextEncoder().encode(packed)));
  var all = new Uint8Array(iv.length + ct.length); all.set(iv); all.set(ct, iv.length);
  var r = await fetch(SHORT_BASE + "/s" + (agent ? "?a=" + encodeURIComponent(agent) : ""), { method: "POST", headers: { "Content-Type": "text/plain" }, body: b64u(all) });
  if (!r.ok) throw new Error("save " + r.status);
  // 중국어판: 짧은 링크 서버의 이동 주소는 한국어판(/plan-tool/)이라, 중국어판 화면으로 바로 열리게 이 페이지 주소에 ?s=아이디를 붙인다 (저장·암호는 같음)
  return location.href.split(/[?#]/)[0] + "?s=" + (await r.json()).id + "#" + b64u(key);
}
async function openShort(id, keyTxt){
  var r = await fetch(SHORT_BASE + "/d/" + id, { cache: "no-store" });
  if (!r.ok) throw new Error(r.status === 404 ? "gone" : "net");
  var all = unb64u(await r.text()), k = await crypto.subtle.importKey("raw", unb64u(keyTxt), "AES-GCM", false, ["decrypt"]);
  var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: all.subarray(0, 12) }, k, all.subarray(12));
  return unpackData(new TextDecoder().decode(pt));
}
document.getElementById("lCopy").onclick = async function(){ lSay(await copyText(LINK) ? "✅ 链接已复制。" : "未能复制，请再按一次。", false); };
document.getElementById("lCopyMsg").onclick = async function(){ lSay(await copyText(lFull()) ? "✅ 文字和链接已复制，请粘贴到KakaoTalk。" : "未能复制，请再按一次。", false); };
document.getElementById("lOpen").onclick = function(){ window.open(LINK, "_blank", "noopener"); };
document.getElementById("lShare").onclick = function(){ navigator.share({ title: "保障建议", text: document.getElementById("lMsg").value.trim(), url: LINK }).catch(function(){}); };
if (CUST) (async function(){
  try { DATA = /^#c=/.test(location.hash) ? await unpackData(location.hash.slice(3)) : await openShort(SHORT_ID, location.hash.slice(1)); renderCust(); window.scrollTo(0, 0); }
  catch (e) { document.getElementById("vCust").innerHTML = '<div class="cv"><div class="err"><h2>无法打开建议书</h2><p>' + (e && e.message === "gone" ? '链接保存期限（90天）已过。请向负责顾问索取新链接。' : '链接可能中途被截断，或手机浏览器版本过旧。请再次点击收到的完整链接，或联系负责顾问。') + '</p></div></div>'; }
})();
