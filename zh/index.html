// 금액: 계산은 그대로, 표기만 중국어(万·亿). 만 단위 이상은 '韩元'을 붙이지 않는다(단위는 머리글에 표시) — 글자가 길어 큰 숫자가 줄바꿈되는 것을 막는다
function won(m){ if (+m > 0 && +m < 1) return Math.round(+m * 10000).toLocaleString("ko-KR") + "韩元"; var fr = Math.round((+m - Math.floor(+m)) * 10000); if (fr > 0 && fr < 10000 && +m < 1000) return Math.floor(+m) + "万" + fr.toLocaleString("ko-KR") + "韩元"; m = Math.round(+m || 0); if (m === 0) return "0"; if (m < 0) return "−" + won(-m); var e = Math.floor(m / 10000), r = m % 10000, s = ""; if (e) s += e + "亿"; if (r) s += (s ? " " : "") + r.toLocaleString("ko-KR") + "万"; return s; }
function wonFull(w){ return (Math.round(+w || 0)).toLocaleString("ko-KR") + "韩元"; }
// PDF 읽기용 원래 한국어 금액 표기(amtMan이 다시 읽음) — 화면에 쓰지 않는다
function wonKo(m){ if (+m > 0 && +m < 1) return Math.round(+m * 10000).toLocaleString("ko-KR") + "원"; var fr = Math.round((+m - Math.floor(+m)) * 10000); if (fr > 0 && fr < 10000 && +m < 1000) return Math.floor(+m) + "만 " + fr.toLocaleString("ko-KR") + "원"; m = Math.round(+m || 0); if (m === 0) return "0원"; if (m < 0) return "−" + wonKo(-m); var e = Math.floor(m / 10000), r = m % 10000, s = ""; if (e) s += e + "억"; if (r) s += (s ? " " : "") + r.toLocaleString("ko-KR") + "만"; return s + "원"; }
function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function pct(v, t){ return (v / t * 100).toFixed(1) + "%"; }
function payTag(n){ var p = PAY[n] || (careParse(n) ? "1일당" : ""); if (!p) return ""; var c = /최초/.test(p) ? "p1" : /매년/.test(p) ? "py" : /회당/.test(p) ? "pc" : "pd"; return '<span class="pt ' + c + '">' + zt(p) + '</span>'; }

// ---------- 계산 ----------
var M; // 계산 결과
function compute(){
  var d = DATA, all = [], byName = {};
  d.groups.forEach(function(g){ g.items.forEach(function(it){ all.push(it); byName[it.n] = it; }); });
  function payOf(p){
    var it = byName[p.i]; if (!it) return { now: 0, aft: 0, ok: false, label: zt(p.i) + '（无此保障）' };
    var cur = +it.now || 0, tot = cur + (+it.add || 0), hp = !!it.hosp;
    if (!tot) return { skip: true }; // 가입하지 않은 담보는 줄을 만들지 않는다
    if (p.days) return { now: cur * p.days, aft: tot * p.days, ok: true, isNew: tot > cur, hp: hp, label: zt(it.n) + ' · ' + won(tot) + ' × ' + p.days + '天' };
    if (!p.k) return { now: cur, aft: tot, ok: true, isNew: tot > cur, hp: hp, label: zt(it.n) + (p.why ? ' · ' + p.why : '') + (cur && tot > cur ? '（现有 ' + won(cur) + ' + 追加 ' + won(tot - cur) + '）' : '') };
    var tb = utFor(p.i, it);
    if (!tb) return { now: 0, aft: 0, ok: false, label: zt(it.n) + '（保额不在条款给付表中 · 请再确认）' };
    var ks = Object.keys(p.k), a = ks.reduce(function(s, k){ return s + tb[k] * p.k[k]; }, 0);
    var why = p.why || (ks.length > 1 ? ks.map(function(k){ return UL[k] + ' ' + tb[k].toLocaleString("ko-KR"); }).join(' + ') : p.k[ks[0]] > 1 ? UL[ks[0]] + ' ' + mn(tb[ks[0]]) + ' × ' + p.k[ks[0]] + '次' : UL[ks[0]]);
    return { now: cur ? a : 0, aft: a, ok: true, hp: hp, label: zt(it.n) + ' · ' + why, isNew: cur === 0 };
  }
  var JL = JOURNEYS_CANCER["남"].concat(JOURNEYS_CANCER["여"], JOURNEYS_BASE); // 캡틴 지시: 암 4가지(폐·대장·유방·자궁) 모두
  var js = JL.map(function(j){
    var used = {}, steps = j.steps.map(function(s){
      var rows = s.pays.map(function(p){ var r = payOf(p); if (p.k && r.ok) used[p.i] = (used[p.i] || 0) + r.aft; return r; }).filter(function(r){ return !r.skip; });
      return { s: s, rows: rows };
    }).filter(function(st){ return st.rows.length; });
    // 통합치료비 한 해 한도: 넘친 만큼 마지막 단계에서 뺀다
    Object.keys(used).forEach(function(nm){
      var it = byName[nm]; if (!it || !it.cap) return;
      var lim = (+it.now || 0) + (+it.add || 0), over = used[nm] - lim;
      if (over > 0) steps[steps.length - 1].rows.push({ now: 0, aft: -over, ok: true, hp: !!it.hosp, isNew: true, cap: true, label: zt(it.n) + ' · 适用一年限额 ' + won(lim) });
    });
    var n = 0, a = 0, hpv = 0;
    steps.forEach(function(st){ var sa = 0; st.rows.forEach(function(r){ n += r.now; a += r.aft; sa += r.aft; if (r.hp) hpv += r.aft; }); st.sum = sa; });
    return { j: j, now: n, aft: a, hp: hpv, steps: steps };
  });
  function has(name, after){ var it = byName[name]; if (!it) return false; return (after ? (+it.now || 0) + (+it.add || 0) : (+it.now || 0)) > 0; }
  var nNow = 0, nAft = 0;
  RANGES.checks.forEach(function(c){ if (c.by.some(function(n){ return has(n, false); })) nNow++; if (c.by.some(function(n){ return has(n, true); })) nAft++; });
  var grown = all.filter(function(it){ return it.add > 0; });
  M = { d: d, all: all, byName: byName, js: js, has: has, nNow: nNow, nAft: nAft, grown: grown,
        top: js.filter(function(x){ return x.aft > x.now; }).sort(function(a, b){ return (b.aft - b.now) - (a.aft - a.now); }) };
}

function hbar(sh){
  return '<div class="hb">' + sh.parts.map(function(p){ return '<i style="width:' + (p.v / sh.total * 100) + '%;background:' + p.c + '" title="' + esc(p.n) + '"></i>'; }).join('') + '</div>';
}

// 수술 한 번에 나오는 수술비 합산 (질병별·상해별·다빈도). 상급종합병원에서 수술한 경우 기준.
function surgRows(){
  var tv = function(n){ var it = M.byName[n]; return it ? (+it.now || 0) + (+it.add || 0) : 0; };
  var tn = function(n){ var it = M.byName[n]; return it ? (+it.now || 0) : 0; };
  var has130 = tv("130대 질병수술비 (11가지)") > 0;
  // 골절 진단비(1사고당 정액)와 신골절치료비(가입금액 × 부위별 지급률)는 담보 이름으로 찾는다
  var fracDx = function(f){ return M.all.filter(function(it){ return /골절/.test(it.n) && /진단/.test(it.n) && !/신골절/.test(it.n); }).reduce(function(s, it){ return s + f(it.n); }, 0); };
  var newFrac = function(f){ return M.all.filter(function(it){ return /신골절/.test(it.n); }).reduce(function(s, it){ return s + f(it.n); }, 0); };
  // 보장분석에 있는 다른 보험의 수술비: 일반 1~5종(1~7종) 수술비, 그 병에 맞는 뇌혈관·심장 수술비만 더한다.
  // 현황표 합계(질병수술비·상해수술비)에 이미 들어간 담보와 특정질병·암·이식 수술비는 빼서 두 번 세지 않는다.
  var conRows = [].concat.apply([], (M.d.conList || []).map(function(c){ return c.rows || []; }));
  var otherSurg = function(e){
    var out = [];
    conRows.forEach(function(r){
      var nm = String(r.n || "").replace(/\s/g, ""), sg = String(r.sig || "").replace(/\s/g, ""), m;
      // 지금 가입한 특정순환계질환 통합치료비: 심장·뇌혈관 수술이면 가입금액별 지급표의 '수술' 금액
      if (e.k === "질병" && /심장질환|뇌혈관질환/.test(e.c130) && /특정순환계질환통합치료비/.test(nm) && !/주요손상/.test(nm) && +r.amt > 0) {
        var hi = /상급종합|권역/.test(nm), tb = UT[hi ? R275 : R274][+r.amt], lb = hi ? "🏥 现有保险 上级综合·区域中心循环系统综合治疗金（手术）" : "现有保险 循环系统综合治疗金（手术）";
        out.push(tb ? [lb, tb.surg, tb.surg, hi ? 1 : 0] : [lb + " · 保额 " + won(+r.amt) + " 请确认给付表", 0, 0, hi ? 1 : 0, "chk"]);
        return;
      }
      if (r.kind === "실손" || !/수술/.test(nm) || ANA_MAP[sg] || !(+r.amt > 0)) return;
      var dis = /질병/.test(nm), inj = /상해|재해/.test(nm);
      if (e.k === "질병" ? inj && !dis : dis && !inj) return;
      if (e.jong && !/암|이식|로봇|특정|\d+대|비뇨|부인|여성|남성|치아|골절|화상|뇌|심장|허혈|순환/.test(nm)) {
        if ((m = nm.match(/(\d)[-~～](\d)종/))) { if (e.jong >= +m[1] && e.jong <= +m[2]) out.push(["其他保险 " + m[1] + "~" + m[2] + "类手术金※", +r.amt, +r.amt]); }
        else if ((m = nm.match(/(\d)종/)) && +m[1] === e.jong) out.push(["其他保险 第" + m[1] + "类手术金", +r.amt, +r.amt]);
      }
      // 지금 가입한 메리츠 등 'N대 질병수술비(분류)' — 82대·130대 등 이름의 분류가 이 예시와 같으면 더한다
      if (e.k === "질병" && e.c130 && (m = nm.match(/(\d+)대질병수술비[(\[](.+?)[)\]]/))) {
        var cat = m[2], hit = e.c130 === "특정31대" ? /^특정\d+대질병$/.test(cat) : e.c130 === "다빈도61대" ? /^다빈도\d+대질병$/.test(cat) : cat === e.c130;
        if (hit) out.push(["现有保险 " + m[1] + "种疾病手术金（" + cat + "）", +r.amt, +r.amt]);
      }
      if (e.k === "질병" && e.c130 === "뇌혈관질환" && /뇌혈관질환수술/.test(nm)) out.push(["脑血管疾病手术金", +r.amt, +r.amt]);
      if (e.k === "질병" && e.c130 === "심장질환" && /(허혈성)?심장질환수술/.test(nm)) out.push([/허혈/.test(nm) ? "缺血性心脏病手术金（如为缺血性）" : "心脏疾病手术金", +r.amt, +r.amt]);
    });
    return out;
  };
  return SURG_EX.map(function(e){
    var parts = e.k === "질병"
      ? [["第" + e.jong + "类手术金", tv("질병 " + e.jong + "종 수술비"), tn("질병 " + e.jong + "종 수술비")], ["130种（" + zt(e.c130) + "）", has130 ? (DATA.surg130 || SURG130)[e.c130] || 0 : 0, 0], ["疾病手术金", tv("질병 수술비"), tn("질병 수술비")], ["🏥 上级综合手术金", tv("상급종합병원 질병수술비"), tn("상급종합병원 질병수술비"), 1]]
      : (e.jong ? [["第" + e.jong + "类手术金", tv("상해 " + e.jong + "종 수술비"), tn("상해 " + e.jong + "종 수술비")], ["意外手术金", tv("상해 수술비"), tn("상해 수술비")], ["🏥 上级综合手术金", tv("상급종합병원 상해수술비"), tn("상급종합병원 상해수술비"), 1]] : [])
        .concat(e.frac ? [["骨折诊断金", fracDx(tv), fracDx(tn)]] : [])
        .concat(e.nf ? [["新骨折治疗金 " + e.nf + "%", newFrac(tv) * e.nf / 100, newFrac(tn) * e.nf / 100]] : []);
    // 심장·뇌혈관 수술이면 특정순환계질환 통합치료비의 '수술' 항목도 나온다(가입금액별 지급표, 수술 1회당). 상급종합·권역센터 담보는 상급종합 수술이라 함께.
    if (e.k === "질병" && /심장질환|뇌혈관질환/.test(e.c130)) [[R274, "循环系统综合治疗金（手术）", 0], [R275, "🏥 上级综合·区域中心循环系统综合治疗金（手术）", 1]].forEach(function(q){
      var t = UT[q[0]], a = tv(q[0]), n = tn(q[0]), ta = utFor(q[0], M.byName[q[0]]);
      if (a > 0 && ta) parts.push([q[1], ta.surg, n > 0 && t[n] ? t[n].surg : 0, q[2]]);
      else if (a > 0) parts.push([q[1] + " · 保额 " + won(a) + " 请确认给付表", 0, 0, q[2], "chk"]); // 지급표에 없는 가입금액: 합계에서 빼고 표시만
    });
    parts = parts.concat(otherSurg(e)).filter(function(x){ return x[1] > 0 || x[4] === "chk"; });
    var tot = parts.reduce(function(s, x){ return s + x[1]; }, 0), now = parts.reduce(function(s, x){ return s + x[2]; }, 0);
    return { e: e, parts: parts, tot: tot, now: now };
  });
}

        // 등급별 담보(예: 자동차사고부상치료비 1-14급): 대표 줄엔 보험료만, 아래 '┗' 줄마다 급수별 금액 → 가장 큰 금액을 가입금액으로
        else if (/\d+-\d+급/.test(cells.join(""))) {
          var top = 0; for (var j = li + 1; j < lines.length && j < li + 40; j++) { var lt = lines[j].t; if (!/┗/.test(lt)) { if (/^\s*\d{1,4}\s*\|/.test(lt)) break; continue; } var cs = lt.split("|"), v = amtMan(cs[cs.length - 1].trim()); if (v > top) top = v; }
          if (top > 0) { cells = cells.slice(0, -1).concat([wonKo(top), cells[cells.length - 1]]); ai = cells.length - 2; }
        }
      }
      if (ai < 1 || !cells[ai + 1] || !/^[\d,\s]+$/.test(cells[ai + 1])) return;
      var head = cells.slice(0, ai), no = null, name = "";
      for (var i = 0; i < head.length; i++) { m = head[i].match(/^(?:[가-힣\/\s]*\s)?(\d{1,4})(?:\s+(.*))?$/); if (m) { no = m[1]; name = head.slice(i + 1).join(""); if (m[2]) name = m[2] + name; break; } }
      if (no === null) return;
      if (!name.replace(/\s/g, "")) name = near().map(function(o){ return o.t.split("|")[0]; }).join("");
      r.riders.push({ no: no, name: name.replace(/\s/g, ""), amt: amtMan(cells[ai]), prem: +cells[ai + 1].replace(/[\s,]/g, ""), sup: sup });
    });
  });
  return r;
}
// 갱신형 설계서는 담보명 앞에 '(10년갱신)갱신형'이 붙는다 → 떼고 읽고(갱신 여부는 renew로 따로 표시), 순환계Ⅱ 기본 담보는 같은 지급표라 기본 이름으로 맞춘다
function cleanRider(s){ return s.replace(/\(통합간편(가입|심사형)\)/g, "").replace(/\(통합간편$/, "").replace(/^\(\d+년갱신\)/, "").replace(/^갱신형/, "").replace(/^특정순환계질환통합치료비Ⅱ\[특정순환계질환통합치료비\]$/, "특정순환계질환통합치료비"); }
// 순환계 통합치료비Ⅱ의 '연간 주요치료Ⅱ N회 이상' 담보: 가입제안서 보장내용 기준(2026-11-17)
function cycTerm(n){
  var m = String(n).replace(/\s/g, "").match(/주요치료Ⅱ(\d)회이상/); if (!m) return null;
  return { when: "因治疗特定循环系统疾病接受的主要治疗Ⅱ（溶栓·综合医院重症监护室4天以上·手术·CRRT·呼吸机·低温治疗·部分体外循环）次数一年内达" + m[1] + "次以上时，每年给付1次保额", note: "手术每次算1次 · 同日手术算1次 · 投保1年内为50%" };
}
// 두 PDF 결과로 새 DATA를 만든다.
function buildFromPdf(ana, prop, who){
  var D = JSON.parse(TEMPLATE), byN = {};
  D.groups.forEach(function(g){ g.items.forEach(function(it){ it.now = 0; it.add = 0; it.rec = 0; byN[it.n] = it; }); });
  // 해지 예정으로 체크를 푼 계약은 현황표 금액에서 그 계약 담보만큼 빼고, 그 밖의 현재 보장에서도 뺀다
  var skip = ana.skip || {}, cut = {};
  ana.extra.forEach(function(x){ if (skip[x.ci]) { var s = x.sig.replace(/\s/g, ""); cut[s] = (cut[s] || 0) + x.amt; } });
  ana.order.forEach(function(k){
    var c = ana.cov[k], nm = ANA_MAP[k], nw = ANA_NEW[k];
    if (!nm && !nw) return;
    if (!nm) { nm = nw[1]; if (!byN[nm]) { byN[nm] = { n: nm, now: 0, rec: 0, add: 0 }; D.groups[nw[0]].items.push(byN[nm]); } }
    byN[nm].now = Math.max(0, c.now - (cut[k] || 0)); byN[nm].rec = c.rec;
  });
  // 현황표에 없는 현재 보장(수술비·특정질병 등)은 회사담보명 그대로 '그 밖의 현재 보장'에 모은다
  var other = {}, covKeys = {};
  Object.keys(ANA_MAP).concat(Object.keys(ANA_NEW)).forEach(function(k){ covKeys[k] = 1; });
  ana.extra.forEach(function(x){ if (!covKeys[x.sig] && !skip[x.ci]) other[x.co] = (other[x.co] || 0) + x.amt; });
  var oi = Object.keys(other).map(function(k){ return { n: k, now: other[k], rec: 0, add: 0 }; });
  var extraNew = [], careNew = [], s130 = {}, plus = { "상해": {}, "질병": {} }, matched = 0;
  prop.riders.forEach(function(x){
    var nm = cleanRider(x.name), m, renew = /갱신형|\d+년갱신/.test(x.name);
    if (cycTerm(nm)) { extraNew.push({ n: nm, now: 0, rec: 0, add: x.amt, rider: nm, renew: renew, unv: false }); matched++; return; }
    // 간병인·간호간병 일당은 병실 입원일당(1인실·2-3인실)과 다른 담보라 따로 둔다 → 간병인 보장 표
    if (careParse(nm)) { careNew.push({ n: nm, now: 0, rec: 0, add: x.amt, rider: nm, svc: x.sup || undefined, unv: !TERMS[nm] && !careTerm(nm) }); return; }
    if ((m = nm.match(/^수술비Ⅱ\(1-5종\)\[(상해|질병)(\d)종\]/))) { var it5 = byN[m[1] + " " + m[2] + "종 수술비"]; it5.add = (+it5.add || 0) + x.amt; matched++; return; }
    if ((m = nm.match(/^(상해|질병)1-5종수술비\(plus\).*\((\d)종/))) { plus[m[1]][m[2]] = (plus[m[1]][m[2]] || 0) + x.amt; matched++; return; }
    if ((m = nm.match(/^130대질병수술비\[(.+?)\]/)) && C130_KEY[m[1]]) { s130[C130_KEY[m[1]]] = (s130[C130_KEY[m[1]]] || 0) + x.amt; matched++; return; }
    for (var i = 0; i < PROP_MAP.length; i++) if (PROP_MAP[i][0].test(nm)) {
      var it = byN[PROP_MAP[i][1]];
      if (PROP_MAP[i][2]) it.add = Math.max(+it.add || 0, x.amt); else { it.add = (+it.add || 0) + x.amt; (it.parts = it.parts || []).push(x.amt); }
      if (!it.rider) { it.rider = nm; it.unv = !TERMS[nm]; }
      if (renew) it.renew = 1;
      matched++; return;
    }
    var sp = /다빈치로봇암수술비\(특정암\)/.test(nm);
    extraNew.push({ n: nm, now: 0, rec: 0, add: x.amt, rider: sp ? "다빈치로봇 암수술비(특정암)" : nm, renew: renew, unv:!sp && !fracTerm(nm) && !lawyerTerm(nm) });
  });
  var i130 = byN["130대 질병수술비 (11가지)"], keys130 = Object.keys(s130);
  i130.add = keys130.length ? Math.max.apply(null, keys130.map(function(k){ return s130[k]; })) : 0;
  D.surg130 = s130;
  ["상해", "질병"].forEach(function(k){
    var p = plus[k], ks = Object.keys(p).sort(); if (!ks.length) return;
    var nm = k + " 1~5종 수술비 plus (연 2회째부터)";
    if (!byN[nm]) { byN[nm] = { n: nm, now: 0, rec: 0, add: 0 }; D.groups[4].items.push(byN[nm]); }
    byN[nm].add = Math.max.apply(null, ks.map(function(j){ return p[j]; }));
    byN[nm].rider = k + " 1-5종 수술비(plus)(연간 2회 이상) " + ks.map(function(j){ return j + "종 " + won(p[j]); }).join("·");
  });
  if (careNew.length) D.groups.push({ icon: "🧑‍⚕️", name: "간병인 보장", items: careNew });
  if (extraNew.length) D.groups.push({ icon: "➕", name: "그 밖의 제안 담보", items: extraNew });
  if (oi.length) D.groups.push({ icon: "📁", name: "그 밖의 현재 보장", items: oi });
  D.customer = who.name; D.age = who.age; D.sex = who.sex; D.date = who.date;
  D.agent = who.agent || prop.agent || ana.agent || ""; D.branch = who.branch || (prop.branch || ana.branch ? "메리츠화재 " + (prop.branch || ana.branch) : "");
  var gone = (ana.list || []).filter(function(x, i){ return skip[i]; });
  D.skipped = gone.map(function(x){ return x.co + " " + x.prod; });
  D.conList = (ana.list || []).map(function(x, i){ return { co: x.co, prod: x.prod, prem: x.prem, paid: !!x.paid, pay: x.pay || "", start: x.start || "", rows: skip[i] ? null : ana.extra.filter(function(r){ return r.ci === i; }).map(function(r){ return { n: r.co, sig: r.sig, amt: r.amt, kind: r.kind }; }) }; }).filter(function(x){ return x.rows; });
  // 2023년 이전에 가입한 변호사 선임비용: 대부분 구속·기소된 경우만 보장(경찰 조사 단계는 2022년 말~2023년 상품부터)
  D.lawyerOld = D.conList.filter(function(c){ return c.start && c.start < "2023" && c.rows.some(function(r){ return /변호사/.test(r.n + r.sig); }); }).map(function(c){ return { co: c.co, start: c.start }; });
  D.contracts = ana.contracts - gone.length; D.premiumAdd = prop.total;
  // 현재 월 보험료: 계약마다 보험료를 다 읽었으면 '납입 중이고 체크한 계약'만 더한다. 못 읽은 계약이 있으면 첫 장 합계에서 뺀다.
  var lst = ana.list || [], live = lst.filter(function(x, i){ return !skip[i] && !x.paid; });
  D.paidList = lst.filter(function(x, i){ return !skip[i] && x.paid; }).map(function(x){ return { co: x.co, prod: x.prod, prem: x.prem, pay: x.pay || "" }; });
  D.premiumNow = lst.length && lst.every(function(x){ return x.prem > 0; })
    ? live.reduce(function(s, x){ return s + x.prem; }, 0)
    : Math.max(0, ana.premium - gone.filter(function(x){ return !x.paid; }).reduce(function(s, x){ return s + x.prem; }, 0));
  var sum = prop.riders.reduce(function(s, x){ return s + x.prem; }, 0);
  return { data: D, check: { riders: prop.riders.length, matched: matched, unknown: extraNew.map(function(x){ return x.n; }), sum: sum, total: prop.total, cov: ana.order.length, covLost: ana.order.filter(function(k){ return !ANA_MAP[k] && !ANA_NEW[k]; }), others: oi.length, odd: ana.odd } };
}
function pdfBox(open){ document.getElementById("pdfBox").classList.toggle("open", open); }
// 보장분석의 가입 상품 목록: 체크를 풀면(해지 예정) 그 계약은 현재 보장·현재 보험료에서 빠진다
function conList(){
  var a = PDF_IN.ana, box = document.getElementById("pCon");
  if (!a || !a.list || !a.list.length) { box.innerHTML = ""; return; }
  box.innerHTML = '<div class="pcon"><b>现有投保产品 ' + a.list.length + '份</b><small>要解约的产品请取消勾选。只有勾选的产品计入现有保障。</small>'
    + a.list.map(function(x, i){ return '<label><input type="checkbox" data-ci="' + i + '"' + (a.skip[i] ? '' : ' checked') + '><span>' + esc(x.co) + ' · ' + esc(x.prod) + '</span><em>' + premTxt(x) + '</em></label>'; }).join('') + '</div>';
  [].forEach.call(box.querySelectorAll('input'), function(cb){ cb.onchange = function(){ if (cb.checked) delete a.skip[cb.dataset.ci]; else a.skip[cb.dataset.ci] = 1; document.getElementById("pResult").innerHTML = ""; }; });

function pdfStatus(){
  var a = PDF_IN.ana, p = PDF_IN.prop, nm = document.getElementById("pName").value.trim(), ag = document.getElementById("pAge").value;
  document.getElementById("pGo").disabled = !((a || p) && nm && +ag > 0);
  conList();
  document.getElementById("pAnaS").innerHTML = a ? '✅ 已读取 保障' + a.order.length + '项 · 合同' + a.contracts + '份' : '';
  var ps = document.getElementById("pPropS");
  ps.innerHTML = PDF_IN.props.length ? PDF_IN.props.map(function(x, i){ return '<div class="ppf">✅ ' + esc(x.name) + ' · 保障' + x.r.riders.length + '项 · 每月 ' + wonFull(x.r.total) + ' <button type="button" data-pi="' + i + '" title="移除">✕</button></div>'; }).join('')
    + (PDF_IN.props.length > 1 ? '<div class="ppf"><b>合计 ' + PDF_IN.props.length + '个 · 保障' + p.riders.length + '项 · 每月 ' + wonFull(p.total) + '</b></div>' : '') : '';
  [].forEach.call(ps.querySelectorAll('button'), function(b){ b.onclick = function(e){ e.stopPropagation(); PDF_IN.props.splice(+b.dataset.pi, 1); PDF_IN.prop = mergeProps(); document.getElementById("pResult").innerHTML = ""; pdfStatus(); }; });
}
async function pdfTake(kind, file){
  var el = document.getElementById(kind === "ana" ? "pAnaS" : "pPropS"); document.getElementById("pResult").innerHTML = "";
  if (kind === "ana") { el.innerHTML = "读取中…"; PDF_IN.ana = null; } else el.insertAdjacentHTML("beforeend", '<div class="ppf">' + esc(file.name) + ' 读取中…</div>');
  try {
    var pages = await readPdfPages(await file.arrayBuffer());
    if (pages.every(function(p){ return !p.length; })) throw new Error("这是没有文字的PDF（图片PDF）。请从公司系统重新下载PDF。");
    var r = kind === "ana" ? parseAnalysis(pages) : parseProposal(pages);
    if (kind === "ana" && !r.order.length) throw new Error("未找到保障分析表。请确认是否为保障分析（보장분석）PDF。");
    if (kind === "prop" && !r.riders.length) throw new Error("未找到保障表。请确认是否为投保设计书（가입제안서）PDF。");
    if (kind === "ana") PDF_IN.ana = r; else { PDF_IN.props.push({ name: file.name, r: r }); PDF_IN.prop = mergeProps(); }
    pdfStatus();
  } catch (e) { pdfStatus(); el.insertAdjacentHTML("beforeend", '<div class="ppf" style="color:var(--red)">❌ ' + (kind === "prop" ? esc(file.name) + ': ' : '') + esc(e.message || e) + '</div>'); }
}
function pdfBuild(){
  var today = new Date(), z = function(n){ return (n < 10 ? "0" : "") + n; };
  var out = buildFromPdf(PDF_IN.ana || { cov: {}, order: [], extra: [], premium: 0, contracts: 0, odd: 0 }, PDF_IN.prop || { riders: [], total: 0, agent: "", branch: "" }, { name: document.getElementById("pName").value.trim(), age: +document.getElementById("pAge").value, sex: document.getElementById("pSex").value, date: today.getFullYear() + "." + z(today.getMonth() + 1) + "." + z(today.getDate()) });
  out.data.noAna = !PDF_IN.ana; out.data.noProp = !PDF_IN.prop;
  DATA = out.data; renderAll(); buildForm();
  var c = out.check, sumOk = c.total && c.sum === c.total, h = !PDF_IN.prop ? '<div class="prc ok">已用保障分析PDF只生成现有保障，没有建议保障。</div>' : '<div class="prc ' + (sumOk ? 'ok' : 'bad') + '">' + (sumOk ? '✅ ' + (PDF_IN.props.length > 1 ? '设计书' + PDF_IN.props.length + '个合计 · ' : '') + '已读取的' + c.riders + '项保障保费之和与设计书合计（' + wonFull(c.total) + '）一致。' : '⚠️ 已读取的保障保费之和 ' + wonFull(c.sum) + ' ≠ 设计书合计 ' + wonFull(c.total) + ' —— 可能有遗漏的保障，请务必用［修改数字］确认。') + '</div>';
  var unv = M.grown.filter(function(it){ return it.unv; });
  if (unv.length) h += '<div class="prc bad">⚠️ 尚未核对条款的保障' + unv.length + '项会显示为“给付条件确认中”，并从治疗示例合计中扣除：' + unv.map(function(it){ return esc(it.n); }).join(", ") + '</div>';
  var pl = DATA.paidList || [];
  if (pl.length) h += '<div class="prc ok">💡 已缴清的合同' + pl.length + '份（' + pl.map(function(x){ return esc(x.co) + ' ' + esc(x.pay || "已缴清"); }).join(', ') + '）已从现有月保费中扣除，保障照常计入。</div>';
  if (c.covLost.length) h +='<div class="prc bad">⚠️ 未能对应的保障分析项目：' + c.covLost.map(esc).join(", ") + '</div>';
  if (c.odd) h += '<div class="prc bad">⚠️ 合同表中未能读取的行 ' + c.odd + '个 —— 可能未计入其他现有保障。</div>';
  var chk = M.js.filter(function(x){ return x.steps.some(function(s){ return s.rows.some(function(r){ return !r.ok; }); }); }).length;
  if (chk) h += '<div class="prc bad">⚠️ 有' + chk + '个治疗示例带“待确认”标记。综合治疗金保额不在条款给付表（基本型4千万·8千万·1亿 / Ⅱ 4千万·7千万·1亿 / 循环系统2千万·3千万·5千万·8千万·1亿）中，该金额已从合计中扣除。</div>';
  h += '<div class="prc">金额是从PDF自动读取的值。给客户看之前，请再与设计书核对一次。</div><button class="pgo" onclick="pdfBox(false);setView(\'sum\');window.scrollTo(0,0)">查看建议书</button>';
  document.getElementById("pResult").innerHTML = h;
}
["ana", "prop"].forEach(function(k){
  var dz = document.getElementById(k === "ana" ? "pAna" : "pProp"), inp = dz.querySelector("input");
  dz.onclick = function(e){ if (e.target !== inp) inp.click(); };
